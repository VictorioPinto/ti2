<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wise Capital</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      /* Estilo da Grelha de Notícias */
      .noticias-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }
      .card-noticia {
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        cursor: pointer;
        transition: transform 0.2s;
        display: flex;
        flex-direction: column;
      }
      .card-noticia:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
      }
      .card-noticia img {
        width: 100%;
        height: 180px;
        object-fit: cover;
      }
      .card-content {
        padding: 15px;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
      }
      .card-content h3 {
        font-size: 1.1rem;
        color: #002d5b;
        margin-bottom: 10px;
      }
      .card-content p {
        color: #64748b;
        font-size: 0.9rem;
        line-height: 1.4;
        flex-grow: 1;
      }
      .loading {
        text-align: center;
        font-size: 1.2rem;
        color: #64748b;
        margin-top: 50px;
      }
    </style>
  </head>
  <body>
    <nav class="sidebar">
      <div class="sidebar-header">
        <img src="./assets/img/logoazul.jpg" alt="Logo Wise Capital" />
        <h2>Wise Capital</h2>
      </div>

      <ul class="sidebar-links">
        <li class="active">
          <a href="../../index.html"><i class="fas fa-home"></i> Início</a>
        </li>
        <li>
          <a href="./pages/trilha/index.html"
            ><i class="fas fa-map-signs"></i> Trilha</a
          >
        </li>
        <li>
          <a href="./pages/forum/index.html"
            ><i class="fas fa-comments"></i> Fórum</a
          >
        </li>
        <li>
          <a href="./pages/simulador/index.html"
            ><i class="fas fa-chart-line"></i> Simulador</a
          >
        </li>
        <li>
          <a href="./pages/biblioteca/index.html"
            ><i class="fas fa-book-open"></i> Biblioteca</a
          >
        </li>
        <li>
          <a href="./pages/faq/faq.html"
            ><i class="fas fa-question-circle"></i> FAQ</a
          >
        </li>
      </ul>

      <div class="sidebar-footer">
        <div class="user-info">
          <i class="fas fa-user-circle"></i>
          <span id="user-name">Carregando...</span>
        </div>
        <button id="btn-logout" class="btn-logout">
          <i class="fas fa-sign-out-alt"></i> Sair
        </button>
      </div>
    </nav>

    <main class="main-content">
      <h1>Mercado Financeiro em Tempo Real</h1>
      <p style="margin-bottom: 20px; color: #64748b">
        Fica a par das últimas novidades e tendências económicas.
      </p>

      <div id="loading-news" class="loading">
        <i class="fas fa-spinner fa-spin"></i> A carregar as últimas notícias...
      </div>
      <div id="news-container" class="noticias-grid"></div>
    </main>
    <script type="module" src="./js/modules/sidebar.js"></script>
    <script type="module" src="./js/modules/noticiasUI.js"></script>
  </body>
</html>
