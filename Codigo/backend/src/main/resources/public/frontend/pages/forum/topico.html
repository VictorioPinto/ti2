<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <title>Ver Tópico</title>
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <link rel="stylesheet" href="../../assets/css/forum.css" />
  </head>
  <body>
    <div class="topic-container">
      <a href="index.html" style="text-decoration: none; color: #0056b3"
        >&larr; Voltar ao Fórum</a
      >

      <div id="post-principal" style="margin-top: 20px"></div>

      <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ddd" />

      <h3>Comentários</h3>
      <form id="form-comentario" class="form-comentario-container">
        <input
          type="text"
          id="texto-comentario"
          placeholder="Escreve um comentário..."
          required
        />
        <button type="submit" class="btn-comentar">Comentar</button>
      </form>

      <div id="lista-comentarios"></div>
    </div>

    <script type="module" src="../../js/modules/forumTopico.js"></script>
  </body>
</html>
