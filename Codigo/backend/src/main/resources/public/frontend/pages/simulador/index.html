<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador - Wise Capital</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <style>
      /* Estilos específicos do Simulador adaptados para o Wise Capital */
      .calculcorpo {
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        margin-bottom: 30px;
      }
      .form-columns {
        display: flex;
        gap: 30px;
        margin-top: 20px;
        flex-wrap: wrap;
      }
      .form-column {
        flex: 1;
        min-width: 300px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
        color: #1e293b;
      }
      .input-wrapper input,
      .rentabilidade-group select {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 5px;
        font-size: 1rem;
      }
      .rentabilidade-group {
        display: flex;
        gap: 10px;
      }
      .rentabilidade-group .input-wrapper {
        flex: 2;
      }
      .rentabilidade-group select {
        flex: 1;
      }
      .form-group-resultado {
        background: #f8fafc;
        padding: 20px;
        border-radius: 8px;
        border-left: 5px solid #002d5b;
        margin-top: 20px;
      }
      .resultado-label {
        display: block;
        font-size: 1.1rem;
        margin-bottom: 10px;
      }
      .resultado-label strong {
        color: #002d5b;
        font-size: 1.3rem;
      }
      .radio-group-row {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../../assets/img/logoazul.jpg" alt="Logo" class="logo" />
        <h2>Wise Capital</h2>
      </div>
      <ul class="sidebar-links">
        <li>
          <a href="../../index.html"><i class="fas fa-home"></i> Início</a>
        </li>
        <li>
          <a href="../trilha/index.html"
            ><i class="fas fa-map-signs"></i> Trilha</a
          >
        </li>
        <li>
          <a href="../forum/index.html"
            ><i class="fas fa-comments"></i> Fórum</a
          >
        </li>
        <li class="active">
          <a href="./index.html"><i class="fas fa-chart-line"></i> Simulador</a>
        </li>
        <li>
          <a href="../biblioteca/index.html"
            ><i class="fas fa-book-open"></i> Biblioteca</a
          >
        </li>
        <li>
          <a href="../noticias/index.html"
            ><i class="fas fa-newspaper"></i> Notícias</a
          >
        </li>
        <li>
          <a href="../faq/faq.html"
            ><i class="fas fa-question-circle"></i> FAQ</a
          >
        </li>
      </ul>
    </aside>

    <main class="main-content">
      <h1>Simulador de Investimentos</h1>
      <p style="margin-bottom: 20px; color: #64748b">
        Descubra quanto o seu dinheiro pode render ao longo do tempo.
      </p>

      <div class="calculcorpo">
        <h3>Tipo de investimento:</h3>
        <div class="radio-group-row">
          <label
            ><input type="radio" name="tipo_investimento" value="tesouro" />
            Tesouro Direto</label
          >
          <label
            ><input type="radio" name="tipo_investimento" value="cdi" checked />
            Atrelado ao CDI</label
          >
          <label
            ><input type="radio" name="tipo_investimento" value="cdb" /> CDB/LC
            Prefixado</label
          >
        </div>

        <div class="form-columns">
          <div class="form-column">
            <div class="form-group">
              <label for="inicial">Valor do investimento inicial (R$)</label>
              <div class="input-wrapper">
                <input type="number" id="inicial" value="1000" step="100" />
              </div>
            </div>
            <div class="form-group">
              <label for="mensal">Aporte mensal (R$)</label>
              <div class="input-wrapper">
                <input type="number" id="mensal" value="200" step="50" />
              </div>
            </div>
          </div>

          <div class="form-column">
            <div class="form-group">
              <label for="meses">Duração do investimento (Meses)</label>
              <div class="input-wrapper">
                <input type="number" id="meses" value="12" step="1" />
              </div>
            </div>
            <div class="form-group">
              <label for="rentabilidade_valor"
                >Rentabilidade Estimada (%):</label
              >
              <div class="rentabilidade-group">
                <div class="input-wrapper">
                  <input
                    type="number"
                    id="rentabilidade_valor"
                    value="1.1"
                    step="0.1"
                  />
                </div>
                <select id="rentabilidade_periodo">
                  <option value="mensal" selected>ao mês</option>
                  <option value="anual">ao ano</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="form-group-resultado">
          <span class="resultado-label"
            >Total Investido:
            <strong id="resultado-investido">R$ 0,00</strong></span
          >
          <span class="resultado-label"
            >Valor Obtido (Com Juros):
            <strong id="resultado-obtido">R$ 0,00</strong></span
          >
        </div>
      </div>
    </main>

    <script type="module" src="../../js/modules/simuladorUI.js"></script>
  </body>
</html>
